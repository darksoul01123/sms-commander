name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Extract Version Name
      id: version
      run: |
        VERSION=$(grep 'versionName' app/build.gradle.kts | sed 's/.*"\(.*\)".*/\1/')
        echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
        echo "APK_NAME=${VERSION}_sms.apk" >> $GITHUB_OUTPUT

    - name: Rename APK to version scheme
      run: |
        mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/${{ steps.version.outputs.APK_NAME }}

    - name: Upload APK as Workflow Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.version.outputs.APK_NAME }}
        path: app/build/outputs/apk/debug/${{ steps.version.outputs.APK_NAME }}
        retention-days: 30

    - name: Create GitHub Release (on tag push only)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/${{ steps.version.outputs.APK_NAME }}
        name: SMS Commander ${{ steps.version.outputs.VERSION }}
        body: |
          ## SMS Commander ${{ steps.version.outputs.VERSION }} — ${{ github.ref_name }}

          ### What Changed in This Release:
          ${{ github.event.head_commit.message }}

          ### Installation Steps (Redmi Note 10 Pro):
          1. Download **`${{ steps.version.outputs.APK_NAME }}`** below.
          2. Install APK on your phone (allow "Install from unknown sources" if prompted).
          3. Open **SMS Commander** and complete the 3 setup steps shown in the app.

          ### All Releases: https://github.com/${{ github.repository }}/releases
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
