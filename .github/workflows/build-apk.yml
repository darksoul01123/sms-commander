name: Build and Release Android APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Make Gradlew Executable
      run: chmod +x gradlew

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: SMSCommander-v0.1-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
        name: SMS Commander Release ${{ github.ref_name }}
        body: |
          ## SMS Commander v0.1 - Initial Release 🚀
          
          ### Features in this Release:
          - **SMS Ingestion Engine**: Automatically intercepts incoming SMS and parses messages from any sender.
          - **Screen Off / Lock Trigger**: Immediately turns off and locks the screen upon receiving code `red` (or any custom code).
          - **Fingerprint-Friendly Lock**: Uses modern Android Accessibility Service (`GLOBAL_ACTION_LOCK_SCREEN`), preserving biometric/fingerprint unlock on Redmi Note 10 Pro.
          - **Redmi Note 10 Pro / MIUI Optimizations**: Direct 1-tap shortcuts in UI for MIUI Autostart and Battery Saver ("No restrictions") to ensure background reliability.
          - **Diagnostics & Testing Dashboard**: In-app permission indicators, keyword customizer, live event logs, and instant "Test Screen Off Now" button.
          
          ### Installation & Quick Start:
          1. Download **`app-debug.apk`** below to your Redmi Note 10 Pro.
          2. Install and launch **SMS Commander**.
          3. Tap **Grant** for SMS Permission.
          4. Tap **Enable** for Screen Lock Service (turn on in *Downloaded Apps*).
          5. Tap **Autostart** and toggle ON; set **Battery Saver** to *No restrictions*.
          6. Send a text with `red` to your phone from any device!
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
